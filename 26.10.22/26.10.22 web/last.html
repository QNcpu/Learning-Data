<!doctype html>
<html>
    <head>
        <title>last</title>
    </head>
    <body>
        <h1>1</h1>
        <audio src="music.mp3" autoplay muted></audio>

        <h1>2</h1>
        <audio src="music.mp3" controls></audio>

        <h1>3</h1>
        <audio src="music.mp3" loop controls></audio>

        <h1>4</h1>
        <audio src="music.mp3" preload="auto" controls></audio>

        <h2>1</h2>
        <video src="video.mp4" autoplay muted with="500"></video>

        <h2>2</h2>
        <video src="video.mp4" controls width="300"></video>

        <h2>3</h2>
        <video src="video.mp4" loop controls width="300"></video>

        <h2>4</h2>
        <video src="video.mp4" preload="auto" controls width="300"></video>

        <h2>5</h2>
        <video src="video.mp4" controls width="400" height="250"></video>
    </body>
</html>
